<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Love board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;family=Shantell+Sans:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF8E8}
a{color:#1F55C9}a:hover{color:#172B70}
:focus-visible{outline:3px solid #E0301A;outline-offset:3px}
</style>
</helmet>
<div style="min-height: 100vh; background-color: #FFE680; background-image: radial-gradient(circle at 20% 30%, rgba(255, 159, 28, 0.85) 0 3.5px, transparent 4.5px), radial-gradient(circle at 70% 65%, rgba(92, 179, 255, 0.95) 0 3px, transparent 4px), radial-gradient(circle at 40% 85%, rgba(224, 48, 26, 0.6) 0 2.5px, transparent 3.5px), radial-gradient(circle at 85% 15%, rgba(31, 85, 201, 0.7) 0 2.5px, transparent 3.5px); background-size: 52px 52px, 42px 42px, 62px 62px, 34px 34px; color: #172B70; font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 24px; border-bottom: 2px solid #172B70; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 16px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 2px solid #172B70; text-decoration: none; color: #172B70; font-weight: 800">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>Home</a>
<div style="display: flex; align-items: center; gap: 10px">
<dc-import name="Icon" icon="envelope" size="40" hint-size="40px,40px"></dc-import>
<h1 style="margin: 0; font-family: 'Shantell Sans', cursive; font-weight: 800; font-size: 30px; line-height: 1">Our love board</h1>
</div>
</div>
<div role="toolbar" aria-label="Board tools" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<sc-for list="{{ tools }}" as="t" hint-placeholder-count="5">
<button type="button" aria-label="{{ t.label }}" style="{{ t.style }}">{{ t.text }}</button>
</sc-for>
<span style="min-width: 56px; text-align: center; font-weight: 800">100%</span>
</div>
</header>

<main style="flex: 1 1 auto; padding: 28px 24px 120px; overflow-x: auto">
<div style="position: relative; width: 1320px; height: 640px; margin: 0 auto; border: 2px solid #172B70; border-radius: 28px; overflow: hidden; background-color: #FFFDF6; background-image: linear-gradient(to right, transparent 86px, rgba(224, 48, 26, 0.45) 86px, rgba(224, 48, 26, 0.45) 88px, transparent 88px), repeating-linear-gradient(to bottom, transparent 0, transparent 35px, rgba(92, 179, 255, 0.6) 35px, rgba(92, 179, 255, 0.6) 37px); box-shadow: 8px 8px 0 #5CB3FF">

<sc-for list="{{ notes }}" as="n" hint-placeholder-count="5">
<button type="button" aria-label="{{ n.aria }}" style="{{ n.style }}">
<span style="{{ n.attach }}"></span>
<span style="display: block; font-family: 'Caveat', cursive; font-weight: 500; font-size: 26px; line-height: 1.2; color: #172B70; text-align: left">{{ n.text }}</span>
<span style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 22px; color: #E0301A">
<span>— {{ n.from }}</span>
<sc-if value="{{ n.fav }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="heart" size="26" hint-size="26px,26px"></dc-import></sc-if>
</span>
</button>
</sc-for>

<sc-for list="{{ stickers }}" as="s" hint-placeholder-count="5">
<div aria-hidden="true" style="{{ s.pos }}"><dc-import name="Icon" icon="{{ s.icon }}" size="{{ s.size }}" sticker="true" tilt="{{ s.tilt }}" hint-size="80px,80px"></dc-import></div>
</sc-for>
</div>
</main>

<nav aria-label="Board actions" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 8px; background: #172B70; border-radius: 999px; box-shadow: 4px 4px 0 #5CB3FF; max-width: calc(100% - 32px); box-sizing: border-box">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px 0 10px; border: 2px solid #FFFFFF; border-radius: 999px; background: #E0301A; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer"><dc-import name="Icon" icon="envelope" size="30" hint-size="30px,30px"></dc-import>Write a letter</button>
<sc-for list="{{ actions }}" as="a" hint-placeholder-count="5">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px 0 8px; border: none; border-radius: 999px; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{ a.icon }}" size="26" hint-size="26px,26px"></dc-import></span>{{ a.label }}</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const toolBase = 'min-width: 44px; height: 44px; padding: 0 12px; border-radius: 14px; border: 2px solid #172B70; font-family: inherit; font-weight: 800; font-size: 15px; color: #172B70; cursor: pointer;';
    const tools = [
      { label: 'Select', text: 'Select', active: true },
      { label: 'Pan the board', text: 'Hand' },
      { label: 'Undo', text: 'Undo' },
      { label: 'Redo', text: 'Redo' },
      { label: 'Zoom out', text: '−' },
      { label: 'Zoom in', text: '+' }
    ].map((t) => ({ ...t, style: toolBase + (t.active ? ' background: #FF9F1C;' : ' background: #FFFFFF;') }));
    const paper = {
      gelato: 'background: #FFE680;',
      sea: 'background: #CDE7FF;',
      citrus: 'background: #FFD8A0;',
      card: 'background-color: #FFFFFF; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 29px, rgba(92, 179, 255, 0.55) 29px, rgba(92, 179, 255, 0.55) 31px);'
    };
    const tape = 'position: absolute; top: -14px; left: 50%; width: 92px; height: 26px; transform: translateX(-50%) rotate(-4deg); background: rgba(92, 179, 255, 0.85); border-left: 2px dashed #FFFFFF; border-right: 2px dashed #FFFFFF;';
    const pin = 'position: absolute; top: -10px; left: 50%; width: 22px; height: 22px; transform: translateX(-50%); border-radius: 50%; background: #E0301A; border: 2px solid #172B70; box-shadow: 2px 3px 0 rgba(23, 43, 112, 0.3);';
    const raw = [
      { x: 130, y: 70, w: 250, r: -4, p: 'gelato', a: 'tape', from: 'Starshine', fav: true, text: 'Thank you for the Agos River day. Basang-basa tayo pero sulit.' },
      { x: 440, y: 130, w: 270, r: 3, p: 'card', a: 'pin', from: 'Junebug', fav: false, text: 'Matcha date soon? Sayo ang matcha, akin ang cookies & cream. Fair.' },
      { x: 780, y: 60, w: 230, r: -2, p: 'citrus', a: 'tape', from: 'Starshine', fav: false, text: 'Reminder: Loafie still hates the vacuum.' },
      { x: 1050, y: 150, w: 220, r: 5, p: 'sea', a: 'pin', from: 'Junebug', fav: true, text: 'PH Arena tonight? Motmot is ready.' },
      { x: 300, y: 390, w: 300, r: 2, p: 'gelato', a: 'pin', from: 'Junebug', fav: true, text: 'Day 1,000. Ikaw pa rin, kahit lasagna vs pizza pa tayo.' }
    ];
    const notes = raw.map((n) => ({
      ...n,
      aria: 'Letter from ' + n.from + ': ' + n.text,
      attach: n.a === 'tape' ? tape : pin,
      style: 'position: absolute; left: ' + n.x + 'px; top: ' + n.y + 'px; width: ' + n.w + 'px; box-sizing: border-box; padding: 28px 22px 16px; border: 2px solid #172B70; border-radius: 6px; transform: rotate(' + n.r + 'deg); box-shadow: 5px 7px 0 rgba(23, 43, 112, 0.18); cursor: grab; font-family: inherit; ' + paper[n.p]
    }));
    const stickers = [
      { icon: 'daisy', size: 88, tilt: -8, x: 700, y: 360 },
      { icon: 'dog', size: 100, tilt: 6, x: 860, y: 420 },
      { icon: 'camera', size: 84, tilt: -10, x: 110, y: 430 },
      { icon: 'star', size: 64, tilt: 12, x: 1180, y: 40 },
      { icon: 'plane', size: 72, tilt: -6, x: 630, y: 34 },
      { icon: 'vinyl', size: 78, tilt: 0, x: 34, y: 250 },
      { icon: 'ball', size: 92, tilt: -4, x: 1110, y: 440 }
    ].map((s) => ({ ...s, pos: 'position: absolute; left: ' + s.x + 'px; top: ' + s.y + 'px;' }));
    const actions = [
      { icon: 'sparkle', label: 'Sticker' },
      { icon: 'heart', label: 'Favorites' },
      { icon: 'envelope', label: 'Archive' },
      { icon: 'film', label: 'Layers' }
    ];
    return { tools, notes, stickers, actions };
  }
}
</script>
</body>
</html>
