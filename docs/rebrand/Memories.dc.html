<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Nunito:wght@400;600;700;800&amp;family=Shantell+Sans:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF8E8}
a{color:#1F55C9}a:hover{color:#172B70}
:focus-visible{outline:3px solid #E0301A;outline-offset:3px}
</style>
</helmet>
<div style="min-height: 100vh; background-color: #FFF8E8; background-image: radial-gradient(circle, rgba(92, 179, 255, 0.5) 2px, transparent 2.6px); background-size: 28px 28px; color: #172B70; font-family: 'Nunito', system-ui, sans-serif; font-size: 17px; line-height: 1.55">

<header style="max-width: 1200px; margin: 0 auto; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #172B70">
<dc-import name="Icon" icon="star" size="42" sticker="true" tilt="-8" hint-size="42px,42px"></dc-import>
<span style="font-family: 'Shantell Sans', cursive; font-weight: 800; font-size: 26px; letter-spacing: -0.5px">for sneakypea</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; background: #FFFFFF; border: 2px solid #172B70; border-radius: 999px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
<a href="{{ n.href }}" style="{{ n.style }}"><dc-import name="Icon" icon="{{ n.icon }}" size="26" hint-size="26px,26px"></dc-import><span>{{ n.label }}</span></a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Notifications, 2 unread" style="position: relative; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 2px solid #172B70; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<dc-import name="Icon" icon="bell" size="30" hint-size="30px,30px"></dc-import>
<span style="position: absolute; top: -5px; right: -5px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E0301A; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFF8E8">2</span>
</button>
<a href="#profile" style="display: flex; align-items: center; gap: 8px; min-height: 48px; box-sizing: border-box; padding: 4px 16px 4px 4px; border-radius: 999px; background: #FFFFFF; border: 2px solid #172B70; text-decoration: none; color: #172B70; font-weight: 800">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #FFE680; display: flex; align-items: center; justify-content: center; overflow: hidden"><dc-import name="Icon" icon="her" size="34" hint-size="34px,34px"></dc-import></span>
<span>Starshine</span>
</a>
</div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 80px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; color: #E0301A">every album is a little pocket of time</p>
<h1 style="margin: 0; font-family: 'Shantell Sans', cursive; font-weight: 800; font-size: 52px; line-height: 1.05; letter-spacing: -1px">Our memories</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<label style="display: flex; align-items: center; gap: 8px; min-height: 52px; box-sizing: border-box; padding: 0 18px; background: #FFFFFF; border: 2px solid #172B70; border-radius: 999px; min-width: 280px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#172B70" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search albums</span>
<input type="search" placeholder="Search albums or captions" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #172B70">
</label>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; background: #E0301A; color: #FFFFFF; border: 2px solid #172B70; box-shadow: 4px 4px 0 #172B70; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New album</button>
</div>
</div>

<div role="tablist" aria-label="View" style="display: inline-flex; gap: 4px; margin: 28px 0 28px; padding: 5px; background: #FFFFFF; border: 2px solid #172B70; border-radius: 999px">
<button type="button" role="tab" aria-selected="true" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 10px; border: none; border-radius: 999px; background: #FF9F1C; color: #172B70; font-family: inherit; font-weight: 800; font-size: 16px"><dc-import name="Icon" icon="film" size="26" hint-size="26px,26px"></dc-import>Albums</button>
<button type="button" role="tab" aria-selected="false" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 10px; border: none; border-radius: 999px; background: transparent; color: #172B70; font-family: inherit; font-weight: 800; font-size: 16px"><dc-import name="Icon" icon="sparkle" size="26" hint-size="26px,26px"></dc-import>Calendar dump</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px">
<sc-for list="{{ albums }}" as="a" hint-placeholder-count="7">
<article style="background: #FFFFFF; border: 2px solid #172B70; border-radius: 26px; overflow: hidden; box-shadow: 6px 6px 0 #5CB3FF">
<div style="{{ a.coverStyle }}">
<dc-import name="Icon" icon="{{ a.icon }}" size="96" hint-size="96px,96px"></dc-import>
<span style="position: absolute; top: 14px; left: 14px; padding: 4px 12px; background: #FFFFFF; border: 2px solid #172B70; border-radius: 999px; font-size: 14px; font-weight: 800">{{ a.count }}</span>
</div>
<div style="padding: 16px 12px 14px 20px; display: flex; align-items: flex-start; gap: 6px">
<div style="flex: 1 1 auto; min-width: 0">
<h2 style="margin: 0; font-family: 'Shantell Sans', cursive; font-weight: 700; font-size: 21px; line-height: 1.2">{{ a.title }}</h2>
<p style="margin: 4px 0 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 20px; line-height: 1.1; color: #E0301A">{{ a.note }}</p>
</div>
<button type="button" aria-label="Edit album" style="flex: none; width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; background: transparent; color: #172B70; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
</button>
</div>
</article>
</sc-for>
<button type="button" style="min-height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: transparent; border: 2.5px dashed #172B70; border-radius: 26px; color: #172B70; font-family: inherit; cursor: pointer">
<dc-import name="Icon" icon="dog" size="96" sticker="true" tilt="-6" hint-size="96px,96px"></dc-import>
<span style="font-family: 'Shantell Sans', cursive; font-weight: 800; font-size: 21px">Start a new album</span>
<span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 21px; color: #E0301A">Loafie is waiting for the next one</span>
</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const link = 'display: flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 16px 0 10px; border-radius: 999px; text-decoration: none; color: #172B70; font-weight: 800; font-size: 16px;';
    const nav = [
      { label: 'Home', icon: 'house', href: 'Main.dc.html' },
      { label: 'Memories', icon: 'camera', href: 'Memories.dc.html', active: true },
      { label: 'Dates', icon: 'motmot', href: 'Dates.dc.html' },
      { label: 'Letters', icon: 'envelope', href: 'Letters.dc.html' }
    ].map((n) => ({ ...n, style: link + (n.active ? ' background: #FF9F1C;' : '') }));
    const cover = 'position: relative; height: 190px; border-bottom: 2px solid #172B70; display: flex; align-items: center; justify-content: center; background: ';
    const albums = [
      { icon: 'bowl', tint: '#FFE680', count: '9 photos', title: 'First date, SM North', note: 'food court → Yoshinoya' },
      { icon: 'mountain', tint: '#5CB3FF', count: '38 photos', title: 'Tanay → Infanta', note: 'the Agos River day' },
      { icon: 'museum', tint: '#FFC76B', count: '21 photos', title: 'Pinto Art Museum', note: 'lost between paintings' },
      { icon: 'ticket', tint: '#CDE7FF', count: '17 photos', title: 'National Museum, Rizal', note: 'film camera came along' },
      { icon: 'bed', tint: '#FFE680', count: '26 photos', title: 'Tagaytay staycation', note: 'Chimken came too' },
      { icon: 'arena', tint: '#CDE7FF', count: '12 photos', title: 'PH Arena nights', note: 'Motmot + NLEX traffic' },
      { icon: 'mic', tint: '#FFC76B', count: '14 photos', title: 'Arcade karaoke', note: 'the early-days hits' },
      { icon: 'ball', tint: '#5CB3FF', count: '11 photos', title: 'Sky Ranch, Pampanga', note: 'the day Skyrie came home' }
    ].map((a) => ({ ...a, coverStyle: cover + a.tint + ';' }));
    return { nav, albums };
  }
}
</script>
</body>
</html>
