
# Load .env for local dev (KEY=VALUE lines are valid property syntax). Gitignored,
# so it's absent in production — Render's real environment variables are set
# directly in its dashboard and take precedence there.
# Two candidate paths because `file:` locations resolve relative to the JVM's
# working directory, which differs by how you run this: a terminal/mvn run from
# fsp_backend/ has CWD=fsp_backend (first path); VS Code's built-in "Run"/"Debug"
# on the main method defaults CWD to the workspace root instead, needing the
# second path. Both are `optional:` so whichever doesn't exist is silently
# skipped rather than erroring.
spring.config.import=optional:file:.env[.properties],optional:file:fsp_backend/.env[.properties]

# Server Configuration
spring.application.name=fsp_backend
server.port=${PORT:8080}

# PostgreSQL Supabase Connection (Transaction Pooler - IPv4)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Hibernate Settings
# Schema is owned by Flyway (db/migration); Hibernate only validates it against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Disable Open Session In View: without this, every request holds a DB
# connection open for the full request/response cycle (including JSON
# serialization + any accidental lazy access in the web layer) instead of
# releasing it as soon as the @Transactional service method returns. All
# lazy associations in this app are already accessed inside @Transactional
# service methods, so turning this off is safe and shortens connection hold
# time under the small 5-connection pool below.
spring.jpa.open-in-view=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1500000
# Supabase's Transaction Pooler (PgBouncer) doesn't guarantee the same backend
# connection across statements, which breaks JDBC server-side prepared
# statement caching (pgjdbc will try to reuse a statement name the pooler
# already recycled onto a different backend, causing intermittent
# "prepared statement already exists"/"does not exist" errors and slow
# retries under load). Disabling prepared-statement reuse is the standard
# fix for Hibernate + Supabase's Transaction Pooler.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Security Settings
app.master-password=${MASTER_PASSWORD}
app.jwt.secret=${JWT_SECRET}
# Comma-separated production frontend origin(s), e.g. https://forsneakypea.vercel.app
app.allowed-origins=${ALLOWED_ORIGINS:}

# Health endpoint only (keep-alive pinger). Includes the DataSource check, so each ping reaches the DB.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Render terminates TLS in a proxy; "native" lets Tomcat resolve the real client IP from
# X-Forwarded-For, trusting it only when the request comes from a private-range proxy.
server.forward-headers-strategy=native

# CORS: comma-separated origin patterns ('*' wildcard allowed). Set CORS_ALLOWED_ORIGINS to
# replace these defaults without a code change.
# Defaults: production site, this project's Vercel preview URLs
# (forsneakypeav1-<hash>-<team>.vercel.app and forsneakypeav1-git-<branch>-<team>.vercel.app),
# and local development.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:https://forsneakypea.vercel.app,https://forsneakypeav1-*-meryllemarquezs-projects.vercel.app,http://localhost:*,http://127.0.0.1:*}

# Flyway: the live database predates Flyway, so on first start it only records V1 as the
# baseline (nothing is executed). New migrations go in db/migration as V2__..., V3__...
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Compress JSON responses (default min size 2KB).
server.compression.enabled=true
server.compression.mime-types=application/json

# Flyway connects through the Supabase session pooler (:5432) when DB_URL is the transaction
# pooler (:6543); see FlywayConfig. Optionally set FLYWAY_DB_URL to override.
app.flyway.url=${FLYWAY_DB_URL:}
