# Load .env for local dev (KEY=VALUE lines are valid property syntax). Gitignored,
# so it's absent in production — Render's real environment variables are set
# directly in its dashboard and take precedence there.
# Two candidate paths because `file:` locations resolve relative to the JVM's
# working directory, which differs by how you run this: `mvn spring-boot:run`
# from fsp_backend/ has CWD=fsp_backend (first path); an IDE run configured with
# the repo root as its working directory needs the second path instead. Both are
# `optional:` so whichever doesn't exist is silently skipped, not an error.
spring.config.import=optional:file:.env[.properties],optional:file:fsp_backend/.env[.properties]

# Server Configuration
spring.application.name=fsp_backend
server.port=8080

# PostgreSQL Connection String (Supabase)
spring.datasource.url=jdbc:postgresql://db.lfdrhgjgxduijhbdbcbi.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Tfruwithme17.
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000