
# Load fsp_backend/.env for local dev (KEY=VALUE lines are valid property syntax).
# Gitignored, so it's absent in production — Render's real environment variables
# are set directly in its dashboard and take precedence there.
spring.config.import=optional:file:.env[.properties]

# Server Configuration
spring.application.name=fsp_backend
server.port=${PORT:8080}

# PostgreSQL Supabase Connection (Transaction Pooler - IPv4)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Security Settings
app.master-password=${MASTER_PASSWORD}
app.jwt.secret=${JWT_SECRET}
# Comma-separated production frontend origin(s), e.g. https://forsneakypea.vercel.app
app.allowed-origins=${ALLOWED_ORIGINS:}
